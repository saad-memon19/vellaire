<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vellaire — Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#7A5C2A}a:hover{color:#16161A}
.seal circle,.seal rect{fill:none;stroke:#C9A96E;stroke-width:1.1}
.seal-gold circle,.seal-gold rect{fill:none;stroke:#B08D4F;stroke-width:1.2}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.vl-in:focus{outline:none;border-color:#C9A96E !important;box-shadow:0 0 0 3px rgba(201,169,110,0.25)}
.vl-dark:hover{background:#2A2A30 !important}
.vl-out:hover{border-color:#16161A !important}
@keyframes vlFloat{0%,100%{transform:perspective(1400px) rotateY(-14deg) rotateX(8deg) translateY(0)}50%{transform:perspective(1400px) rotateY(-8deg) rotateX(5deg) translateY(-10px)}}
.vl-float{animation:vlFloat 10s cubic-bezier(.45,0,.25,1) infinite}
@media (prefers-reduced-motion: reduce){.vl-float{animation:none}}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, sans-serif">
  <aside style="flex: 11 1 520px; background: radial-gradient(60% 50% at 50% 45%, rgba(176,141,79,0.2), rgba(239,233,221,0) 70%), #EFE9DD; color: #17171B; padding: 48px 56px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 48px; min-height: 560px">
    <div style="display: flex; align-items: center; gap: 12px">
      <svg class="seal-gold" width="30" height="30" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18.5"></circle><rect x="17.6" y="8" width="4.8" height="21" rx="0.8" transform="rotate(-20 20 29)"></rect><rect x="17.6" y="8" width="4.8" height="21" rx="0.8" transform="rotate(20 20 29)"></rect></svg>
      <span style="font-family: 'Cormorant Garamond', 'Times New Roman', serif; font-size: 20px; letter-spacing: 0.24em; font-weight: 600">VELLAIRE</span>
    </div>
    <div style="display: flex; justify-content: center">
      <div class="vl-float" style="width: 420px; max-width: 90%; aspect-ratio: 1.586; border-radius: 18px; background: linear-gradient(135deg, #1C1C20 0%, #0E0E10 42%, #26262C 56%, #0C0C0E 100%); border: 1px solid rgba(201,169,110,0.38); box-shadow: 0 50px 90px rgba(23,23,27,0.3); color: #F6F1E7; padding: 30px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <svg class="seal" width="30" height="30" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18.5"></circle><rect x="17.6" y="8" width="4.8" height="21" rx="0.8" transform="rotate(-20 20 29)"></rect><rect x="17.6" y="8" width="4.8" height="21" rx="0.8" transform="rotate(20 20 29)"></rect></svg>
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: #C9A96E; width: 24px; height: 24px"><path d="M8 8.5a5 5 0 0 1 0 7M11.5 6a8.5 8.5 0 0 1 0 12M15 3.5a12 12 0 0 1 0 17"></path></svg>
        </div>
        <div style="font-family: 'Cormorant Garamond', 'Times New Roman', serif; font-size: 30px">Welcome back</div>
      </div>
    </div>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 12px; max-width: 480px">
      <blockquote style="margin: 0; font-family: 'Cormorant Garamond', 'Times New Roman', serif; font-style: italic; font-weight: 300; font-size: 26px; line-height: 1.35; color: #17171B">“[Client quote about first impressions.]”</blockquote>
      <figcaption style="font-size: 13px; color: #5E5952; letter-spacing: 0.06em">[NAME], [TITLE] · [COMPANY]</figcaption>
    </figure>
  </aside>

  <main style="flex: 9 1 420px; background: #FFFFFF; color: #16161A; display: flex; align-items: center; justify-content: center; padding: 48px 32px; box-sizing: border-box">
    <div style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 32px">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <h1 style="margin: 0; font-family: 'Cormorant Garamond', 'Times New Roman', serif; font-weight: 400; font-size: 44px; line-height: 1.05">Sign in</h1>
        <p style="margin: 0; color: #5E5A52; font-size: 15px">Use your work email. If your company uses single sign-on, we will take you there.</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="email" style="font-size: 13px; font-weight: 500; color: #3A3A42">Work email</label>
        <input id="email" class="vl-in" type="email" placeholder="name@company.com" style="height: 48px; border: 1px solid #D8D2C6; border-radius: 6px; background: #FFFFFF; padding: 0 16px; font-family: inherit; font-size: 15px; color: #16161A">
      </div>
      <button type="button" class="vl-dark" style="height: 50px; border: none; border-radius: 6px; background: #16161A; color: #F6F1E7; font-family: inherit; font-size: 15px; font-weight: 500; letter-spacing: 0.02em; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px">Continue <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: #C9A96E"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
      <div style="display: flex; align-items: center; gap: 16px; color: #8A857B; font-size: 12px; letter-spacing: 0.14em"><div style="flex: 1; height: 1px; background: #E2DCD0"></div>OR<div style="flex: 1; height: 1px; background: #E2DCD0"></div></div>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <button type="button" class="vl-out" style="height: 48px; border: 1px solid #D8D2C6; border-radius: 6px; background: transparent; font-family: inherit; font-size: 15px; color: #16161A; cursor: pointer">Continue with Google</button>
        <button type="button" class="vl-out" style="height: 48px; border: 1px solid #D8D2C6; border-radius: 6px; background: transparent; font-family: inherit; font-size: 15px; color: #16161A; cursor: pointer">Continue with Microsoft</button>
        <button type="button" class="vl-out" style="height: 48px; border: 1px solid #D8D2C6; border-radius: 6px; background: transparent; font-family: inherit; font-size: 15px; color: #16161A; cursor: pointer">Email me a magic link</button>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 14px; color: #5E5A52; flex-wrap: wrap; gap: 8px">
        <span>New to Vellaire? <a href="Main.dc.html">Book a private demo</a></span>
        <a href="SignIn.dc.html">Trouble signing in</a>
      </div>
    </div>
  </main>
</div>
</x-dc>
