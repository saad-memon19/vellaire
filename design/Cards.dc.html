<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Company dashboard — All cards</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&amp;family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400&amp;display=swap">
<style>
body{margin:0;background:#F7F5F0}
a{color:#876A33;text-decoration:none}a:hover{color:#17171B}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.seal circle,.seal rect{fill:none;stroke:#B08D4F;stroke-width:1.2}
.nav-a:hover{background:#F7F3EA !important;color:#17171B !important}
.tile:hover{border-color:#B08D4F !important;transform:translateY(-2px)}
.tile{transition:transform 250ms cubic-bezier(.22,1,.36,1),border-color 250ms}
.ink:hover{background:#2E2E35 !important}
.row:hover{background:#FAF7F1}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F7F5F0; color: #17171B; font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, sans-serif; font-size: 14px">

  <aside aria-label="Workspace navigation" style="flex: 1 1 248px; background: #FFFFFF; border-right: 1px solid #E6E0D5; padding: 22px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 10px">
      <svg class="seal" width="28" height="28" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18.5"></circle><rect x="17.6" y="8" width="4.8" height="21" rx="0.8" transform="rotate(-20 20 29)"></rect><rect x="17.6" y="8" width="4.8" height="21" rx="0.8" transform="rotate(20 20 29)"></rect></svg>
      <span style="font-family: 'Cormorant Garamond', 'Times New Roman', serif; letter-spacing: 0.24em; font-size: 17px; font-weight: 500">VELLAIRE</span>
    </div>
    <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 10px; border: 1px solid #E6E0D5; background: #F7F5F0; color: #17171B; font-family: inherit; cursor: pointer; min-height: 52px">
      <span style="width: 34px; height: 34px; border-radius: 8px; background: #17171B; display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: 17px; color: #E6D3A3">M</span>
      <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; flex: 1"><span style="font-size: 14px; font-weight: 600">Meridian Capital</span><span style="font-size: 12px; color: #6E685F">Enterprise · 1,320 seats</span></span>
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: #8E887E"><path d="M8 10l4-4 4 4M8 14l4 4 4-4"></path></svg>
    </button>
    <nav style="display: flex; flex-direction: column; gap: 16px">
      <sc-for list="{{nav}}" as="grp" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <sc-if value="{{grp.g}}" hint-placeholder-val="{{ true }}"><div style="font-size: 10.5px; letter-spacing: 0.18em; color: #7A746A; padding: 0 12px 6px; font-weight: 500">{{grp.g}}</div></sc-if>
          <sc-for list="{{grp.items}}" as="it" hint-placeholder-count="3">
            <a href="{{it.href}}" class="nav-a" style="display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 8px; font-size: 14px; min-height: 36px; box-sizing: border-box; background: {{it.bg}}; color: {{it.color}}; font-weight: {{it.weight}}">
              <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: {{it.iconColor}}"><path d="{{it.d}}"></path></svg>
              <span style="flex: 1">{{it.label}}</span>
              <sc-if value="{{it.badge}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #F6EFE1; color: #876A33; font-weight: 600">{{it.badge}}</span></sc-if>
            </a>
          </sc-for>
        </div>
      </sc-for>
    </nav>
  </aside>

  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <header style="display: flex; align-items: center; gap: 16px; padding: 16px 40px; border-bottom: 1px solid #E6E0D5; background: #FFFFFF; flex-wrap: wrap">
      <label for="q" style="flex: 1 1 320px; max-width: 520px; display: flex; align-items: center; gap: 10px; background: #F7F5F0; border: 1px solid #E6E0D5; border-radius: 8px; padding: 0 14px; height: 42px; color: #6E685F">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-3.5-3.5"></path></svg>
        <input id="q" type="search" placeholder="Search people, cards, settings" style="flex: 1; background: transparent; border: none; outline: none; color: #17171B; font-family: inherit; font-size: 14px; min-width: 0">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; border: 1px solid #E0D9CC; border-radius: 4px; padding: 2px 6px; background: #FFFFFF">⌘K</span>
      </label>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 8px">
        <button type="button" aria-label="Help" style="width: 42px; height: 42px; border-radius: 8px; border: 1px solid #E6E0D5; background: #FFFFFF; color: #4E4A44; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01"></path></svg></button>
        <button type="button" aria-label="Notifications, 3 unread" style="position: relative; width: 42px; height: 42px; border-radius: 8px; border: 1px solid #E6E0D5; background: #FFFFFF; color: #4E4A44; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"></path></svg><span style="position: absolute; top: 9px; right: 10px; width: 7px; height: 7px; border-radius: 50%; background: #B08D4F"></span></button>
        <button type="button" aria-label="Account menu" style="width: 42px; height: 42px; border-radius: 50%; border: 1px solid #D9C9A6; background: #F6EFE1; color: #876A33; font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 600; cursor: pointer">SK</button>
      </div>
    </header>

    <main style="padding: 36px 40px 56px; display: flex; flex-direction: column; gap: 24px; max-width: 1280px; width: 100%; box-sizing: border-box">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="font-size: 12px; letter-spacing: 0.2em; color: #876A33; font-weight: 500">CARDS</div>
          <h1 style="margin: 0; font-family: 'Cormorant Garamond', 'Times New Roman', serif; font-weight: 400; font-size: 46px; line-height: 1.05">All cards</h1>
          <p style="margin: 0; color: #5E5952; font-size: 15px">1,248 cards across 6 departments and 4 offices.</p>
        </div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap">
          <a href="#" style="height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid #D9D2C4; background: #FFFFFF; color: #17171B; font-size: 14px; display: inline-flex; gap: 8px; align-items: center"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM20 14v1M14 20h1M18 18h3v3"></path></svg>Download all QR codes</a>
          <a href="CreateStep1.dc.html" class="ink" style="height: 44px; padding: 0 20px; border-radius: 8px; background: #17171B; color: #FFFFFF; font-size: 14px; font-weight: 600; display: inline-flex; gap: 8px; align-items: center"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: #E6D3A3"><path d="M12 5v14M5 12h14"></path></svg>Create a card</a>
        </div>
      </div>

      <div role="tablist" aria-label="Card status" style="display: flex; gap: 28px; border-bottom: 1px solid #E6E0D5; flex-wrap: wrap">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
          <button type="button" role="tab" aria-selected="{{t.sel}}" style="background: transparent; border: none; padding: 12px 0; margin-bottom: -1px; font-family: inherit; font-size: 14px; cursor: pointer; display: flex; gap: 8px; align-items: center; color: {{t.color}}; font-weight: {{t.weight}}; border-bottom: 2px solid {{t.line}}">{{t.name}}<span style="font-size: 12px; padding: 1px 8px; border-radius: 999px; background: {{t.pill}}; color: #4E4A44">{{t.count}}</span></button>
        </sc-for>
      </div>

      <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center">
        <label for="cs" style="flex: 1 1 260px; max-width: 360px; display: flex; align-items: center; gap: 10px; background: #FFFFFF; border: 1px solid #E6E0D5; border-radius: 8px; padding: 0 12px; height: 42px; color: #6E685F">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-3.5-3.5"></path></svg>
          <input id="cs" type="search" placeholder="Search by name or title" style="flex: 1; border: none; outline: none; background: transparent; font-family: inherit; font-size: 14px; color: #17171B; min-width: 0">
        </label>
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
          <button type="button" style="height: 42px; padding: 0 14px; border-radius: 8px; border: 1px solid #E6E0D5; background: #FFFFFF; color: #17171B; font-family: inherit; font-size: 14px; display: flex; align-items: center; gap: 8px; cursor: pointer">{{f}}<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px; color: #8E887E"><path d="M7 10l5 5 5-5"></path></svg></button>
        </sc-for>
        <div style="margin-left: auto; display: flex; gap: 4px; background: #FFFFFF; border: 1px solid #E6E0D5; border-radius: 8px; padding: 3px">
          <button type="button" aria-label="Grid view" style="width: 36px; height: 34px; border-radius: 6px; border: none; background: #F4EEE2; color: #876A33; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"></path></svg></button>
          <button type="button" aria-label="List view" style="width: 36px; height: 34px; border-radius: 6px; border: none; background: transparent; color: #8E887E; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"></path></svg></button>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(250px, 100%), 1fr)); gap: 18px">
        <sc-for list="{{cards}}" as="c" hint-placeholder-count="8">
          <article class="tile" style="background: #FFFFFF; border: 1px solid #E6E0D5; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 14px; position: relative">
            <a href="Editor.dc.html" aria-label="Open {{c.name}}" style="aspect-ratio: 1.586; border-radius: 10px; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; background: {{c.bg}}; color: {{c.fg}}; border: 1px solid {{c.line}}; box-shadow: 0 10px 22px rgba(23,23,27,0.10)">
              <span style="font-size: 8.5px; letter-spacing: 0.28em; color: {{c.accent}}">MERIDIAN CAPITAL</span>
              <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'Cormorant Garamond', serif; font-size: 22px">{{c.name}}</span><span style="height: 1px; width: 30px; background: {{c.accent}}"></span><span style="font-size: 10.5px; color: {{c.sub}}">{{c.title}}</span></span>
            </a>
            <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 2px">
              <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px"><span style="font-size: 15px; font-weight: 600">{{c.name}}</span><span style="font-size: 12px; padding: 3px 10px; border-radius: 999px; font-weight: 500; background: {{c.stBg}}; color: {{c.stFg}}">{{c.status}}</span></div>
              <div style="font-size: 13px; color: #5E5952">{{c.title}} · {{c.dept}}</div>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 2px 0; border-top: 1px solid #F0EBE2; font-size: 12.5px; color: #6E685F">
              <span style="display: flex; gap: 6px; align-items: center"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path></svg>{{c.views}} views</span>
              <span>{{c.source}}</span>
            </div>
          </article>
        </sc-for>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; font-size: 14px; color: #5E5952">
        <span>Showing 1–8 of 1,248</span>
        <div style="display: flex; gap: 8px">
          <button type="button" style="height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #E6E0D5; background: #FFFFFF; color: #8E887E; font-family: inherit; font-size: 14px">Previous</button>
          <button type="button" style="height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #D9D2C4; background: #FFFFFF; color: #17171B; font-family: inherit; font-size: 14px; cursor: pointer">Next</button>
        </div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1380}}'>
class Component extends DCLogic {
  renderVals() {
    const I = {

      plus: 'M12 5v14M5 12h14',
      grid: 'M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z',
      palette: 'M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.8 1.8-1.7 0-1.3-1-1.6-1-2.8 0-1 .8-1.5 1.8-1.5H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z',
      people: 'M9 11.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.9.7 3.1 2.4 3.5 5.2',

      mail: 'M5 5h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zM3.5 6l8.5 7 8.5-7',

      shield: 'M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z',
      receipt: 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6',
      gear: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1',

    };
    const active = 'cards';
    const mk = (id, label, d, href, badge) => ({
      label, d, href: href || '#', badge: badge || '',

    const nav = [
      { g: '', items: [mk('home', 'Home', I.home, 'Overview.dc.html')] },
      { g: 'CARDS', items: [mk('cards', 'All cards', I.card, 'Cards.dc.html'), mk('create', 'Create a card', I.plus, 'CreateStep1.dc.html'), mk('templates', 'Templates', I.grid), mk('brand', 'Brand kit', I.palette, 'BrandKit.dc.html')] },

    const TH = {

        cd('Hana Qureshi', 'Relationship Manager', 'Karachi', 'emerald', 'Live', '1,205', 'CSV'),
        cd('Tom Allerton', 'Partner', 'London', 'navy', 'Live', '2,388', 'Workday')
      ] };
  }
}
</script>
</body>
</html>
