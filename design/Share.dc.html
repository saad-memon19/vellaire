<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const N = 25;
    let seed = 7;
    const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
    const finder = (r, c, r0, c0) => {
      const y = r - r0, x = c - c0;
      if (y < 0 || x < 0 || y > 6 || x > 6) return null;
      if (y === 0 || y === 6 || x === 0 || x === 6) return true;
      if (y >= 2 && y <= 4 && x >= 2 && x <= 4) return true;
      return false;
    };
    const cells = [];
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        let on = finder(r, c, 0, 0);
        if (on === null) on = finder(r, c, 0, N - 7);
        if (on === null) on = finder(r, c, N - 7, 0);
        const nearFinder = (r <= 7 && c <= 7) || (r <= 7 && c >= N - 8) || (r >= N - 8 && c <= 7);
        if (on === null && nearFinder) on = false;
        if (on === null && (r === 6 || c === 6)) on = (r + c) % 2 === 0;
        if (on === null) on = rnd() > 0.52;
        cells.push({ bg: on ? '#16161A' : 'transparent' });
      }
    }
    return { cells };
  }
}
</script>
