<style>

        <p style="margin: 0; color: #5E5A52; font-size: 15px">Start with your company. You can invite your team after setup.</p>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
        <div style="display: flex; flex-direction: column; gap: 8px"><label for="fn" style="font-size: 13px; font-weight: 500; color: #3A3A42">First name</label><input id="fn" class="vl-in" value="Sara" style="height: 48px; border: 1px solid #D8D2C6; border-radius: 6px; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 15px; color: #16161A; min-width: 0"></div>

      <div style="display: flex; flex-direction: column; gap: 8px"><label for="co" style="font-size: 13px; font-weight: 500; color: #3A3A42">Company</label><input id="co" class="vl-in" value="Meridian Capital" style="height: 48px; border: 1px solid #D8D2C6; border-radius: 6px; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 15px; color: #16161A"></div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="pw" style="font-size: 13px; font-weight: 500; color: #3A3A42">Password</label>
        <input id="pw" class="vl-in" type="password" value="xxxxxxxxxxxx" style="height: 48px; border: 1px solid #D8D2C6; border-radius: 6px; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 15px; color: #16161A">
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px"><span style="height: 4px; border-radius: 999px; background: #1F7A55"></span><span style="height: 4px; border-radius: 999px; background: #1F7A55"></span><span style="height: 4px; border-radius: 999px; background: #1F7A55"></span><span style="height: 4px; border-radius: 999px; background: #E2DCD0"></span></div>
        <div style="display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: #1F7A55"><span>✓ 12+ characters</span><span>✓ A number</span><span>✓ A symbol</span></div>
      </div>
      <label style="display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: #4E4A44; line-height: 1.5; cursor: pointer"><input type="checkbox" checked style="width: 17px; height: 17px; accent-color: #16161A; margin-top: 2px">I agree to the <a href="#">Terms</a> and <a href="#">Privacy policy</a></label>

      <div style="font-size: 14px; color: #5E5A52">Already have an account? <a href="SignIn.dc.html">Sign in</a></div>
